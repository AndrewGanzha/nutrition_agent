site_name: nutrition-agent
site_description: Движок, превращающий текст, фото и голос с описанием еды в структурированные записи о питании
repo_url: https://github.com/AndrewGanzha/nutrition_agent
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Обзор: index.md
  - API: api.md
  - Use cases: use_cases.md
  - Google Health: google_health.md
  - План задач: tasks.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
