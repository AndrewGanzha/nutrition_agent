[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrition-agent"
version = "0.1.0"
description = "Engine for turning text, photo and audio meal descriptions into nutrition entries"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.9",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nutrition_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".agents", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nutrition_agent"]

[tool.ruff.lint.per-file-ignores]
# The Russian extraction prompt is prose, not identifiers: Cyrillic letters that
# look Latin are intentional there.
"src/nutrition_agent/extraction.py" = ["RUF001"]
# Google payloads carry Russian food names and units ("150 г") on purpose.
"src/nutrition_agent/sinks/google_health.py" = ["RUF001"]
# The smoke script feeds and prints Russian meal text.
"scripts/**" = ["RUF001"]
# Tests feed realistic Russian meal text to the pipeline.
"tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "examples"]
